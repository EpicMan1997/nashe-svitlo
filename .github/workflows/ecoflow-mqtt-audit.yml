name: EcoFlow | official MQTT one-time audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mqtt_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'paho-mqtt>=2.0,<3.0'
      - name: Test read-only official EcoFlow Developer MQTT
        env:
          ECOFLOW_ACCESS_KEY: ${{ secrets.ECOFLOW_ACCESS_KEY }}
          ECOFLOW_SECRET_KEY: ${{ secrets.ECOFLOW_SECRET_KEY }}
        run: python scripts/ecoflow_mqtt_audit.py
