name: Наше Світло | оновлення графіків і публікація
on:
  push:
    branches: [main]
  # Reliable primary: external workflow_dispatch roughly every 10 minutes.
  # Emergency announcements can arrive at any hour. Five-minute UTC
  # backup schedule (GitHub scheduler is best-effort and may run late).
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nashe-svitlo-pages-v3
  # Never cancel a publish already running when scheduled checks overlap.
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: node --check site/ecoflow.js
      - run: node --check site/ecoflow-live.js
      - run: node --test tests/ecoflow-live.test.cjs
      - run: node --test tests/site-runtime-smoke.test.cjs
      - run: node --test tests/page-runtime-smoke.test.cjs
      - run: python -m unittest discover -s tests -v
      - run: python scripts/refresh.py
      - name: Fetch supported EcoFlow stations (read-only, ~10-minute snapshots)
        env:
          ECOFLOW_ACCESS_KEY: ${{ secrets.ECOFLOW_ACCESS_KEY }}
          ECOFLOW_SECRET_KEY: ${{ secrets.ECOFLOW_SECRET_KEY }}
        run: python scripts/ecoflow_publish.py
      - run: python scripts/validate_build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Persist history (does not block publication)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json state/season.json
          if ! git diff --cached --quiet; then
            git commit -m "Update outage history"
            if ! git push; then
              echo "::warning::History push conflicted with a newer commit; keeping the published graph live."
            fi
          fi
