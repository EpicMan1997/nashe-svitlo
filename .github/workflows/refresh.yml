name: Наше Світло | оновлення графіків і публікація
on:
  push:
    branches: [main]
  # External workflow_dispatch is currently around 10 min; configure its existing
  # cron-job.org job for 2 min. GitHub schedule is a best-effort 5-min fallback.
  # Emergency announcements can arrive at any hour. Five-minute UTC
  # backup schedule (GitHub scheduler is best-effort and may run late).
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nashe-svitlo-pages-v3
  # Never cancel a publish already running when scheduled checks overlap.
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - run: node --check site/ecoflow.js
      - run: node --check site/ecoflow-live.js
      - run: node --test tests/ecoflow-live.test.cjs
      - run: node --test tests/site-runtime-smoke.test.cjs
      - run: node --test tests/page-runtime-smoke.test.cjs
      - id: unit_tests
        run: python -m unittest discover -s tests -v
      - id: outage_refresh
        run: python scripts/refresh.py
      - name: Fetch supported EcoFlow stations (read-only, scheduled snapshot)
        env:
          ECOFLOW_ACCESS_KEY: ${{ secrets.ECOFLOW_ACCESS_KEY }}
          ECOFLOW_SECRET_KEY: ${{ secrets.ECOFLOW_SECRET_KEY }}
        run: python scripts/ecoflow_publish.py
      - id: build_validate
        run: python scripts/validate_build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Persist history (does not block publication)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json state/season.json
          if ! git diff --cached --quiet; then
            git commit -m "Update outage history"
            if ! git push; then
              echo "::warning::History push conflicted with a newer commit; keeping the published graph live."
            fi
          fi
      - name: Inspect public KolySvitlo HTML for parser recovery
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import requests, re
          from bs4 import BeautifulSoup
          try:
              response = requests.get('https://kolysvitlo.com/schedule/dtek_kyiv_oblast', timeout=15, headers={'User-Agent': 'Mozilla/5.0'})
              soup = BeautifulSoup(response.text, 'html.parser')
              print('KOLY_PROBE', response.status_code, 'length', len(response.text))
              print('KOLY_DOM', 'scripts', len(soup.select('script')), 'rows', len(soup.select('tr,[role=row]')),
                    'data-group', len(soup.select('[data-group],[data-queue]')))
              print('KOLY_SCRIPT_URLS', [x.get('src') for x in soup.select('script[src]')][:15])
              for script in soup.select('script'):
                  body=script.string or script.get_text() or ''
                  for key in ('/api/', 'fetch(', 'schedule', 'dataset', 'groupId', '/static/'):
                      at=body.find(key)
                      if at>=0: print('KOLY_JS_FOCUS',key,repr(body[max(0,at-85):at+180]))
              for script in soup.select('script'):
                  content = script.string or script.get_text() or ''
                  matches = [token for token in ('3.1','11:00','22:30','dtek_kyiv_oblast','intervals') if token in content]
                  print('KOLY_SCRIPT',script.get('id',''), 'size',len(content),'matches',matches)
                  if matches and len(content)<180000:
                      for token in ('11:00','22:30'):
                          i=content.find(token)
                          if i>=0: print('KOLY_CONTEXT',token,repr(content[max(0,i-100):i+100]))
              for node in soup.find_all(string=re.compile('3[.]1'))[:5]:
                  p = node.parent
                  print('KOLY_NODE', str(p.parent if p.parent else p)[:1100])
          except Exception as e:
              print('KOLY_PROBE_ERROR',type(e).__name__)
          PY
      - name: Record last refresh workflow outcome
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        env:
          TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
          OUTAGE_OUTCOME: ${{ steps.outage_refresh.outcome }}
          VALIDATE_OUTCOME: ${{ steps.build_validate.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          result = {
              "checked_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "run_id": os.getenv("GH_RUN_ID", ""),
              "run_attempt": os.getenv("GH_RUN_ATTEMPT", ""),
              "unit_tests": os.getenv("TEST_OUTCOME", ""),
              "outage_refresh": os.getenv("OUTAGE_OUTCOME", ""),
              "validation": os.getenv("VALIDATE_OUTCOME", ""),
              "deployment": os.getenv("DEPLOY_OUTCOME", ""),
          }
          target = Path("state/workflow_health.json")
          target.parent.mkdir(exist_ok=True)
          target.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/workflow_health.json
          if ! git diff --cached --quiet; then
            git commit -m "Record refresh workflow health"
            if ! git push; then
              echo "::warning::Unable to persist workflow health; see this run's logs."
            fi
          fi
